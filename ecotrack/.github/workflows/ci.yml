name: EcoTrack CI

on:

  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - main
      - develop

jobs:

  validate:

    name: Validar projeto

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar sintaxe
        run: npm run check

      - name: Executar testes
        run: npm test
